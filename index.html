<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Note</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  * { box-sizing: border-box; }
  :root { --fond: #fff; --texte: #111; --bord: #e5e5e5; --bouton: #fff; --appui: #f2f2f2; --voile: rgba(0,0,0,.35); }
  @media (prefers-color-scheme: dark) {
    :root { --fond: #111; --texte: #eee; --bord: #333; --bouton: #1c1c1c; --appui: #2a2a2a; --voile: rgba(0,0,0,.6); }
  }
  html, body { margin: 0; height: 100%; background: var(--fond); color: var(--texte); }
  body { display: flex; flex-direction: column; font: 18px/1.5 system-ui, sans-serif; }
  #onglets {
    display: flex; padding: max(8px, env(safe-area-inset-top)) 16px 0;
    border-bottom: 1px solid var(--bord);
  }
  #onglets button {
    flex: 1; min-width: 0; border: 0; border-radius: 0; background: none; padding: 8px 4px;
    border-bottom: 2px solid transparent; opacity: .5;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #onglets button[aria-selected="true"] { border-bottom-color: currentColor; opacity: 1; font-weight: 600; }
  textarea {
    flex: 1; width: 100%; border: 0; outline: 0; resize: none; padding: 16px;
    font: inherit; background: transparent; color: inherit;
  }
  nav {
    display: flex; gap: 6px; padding: 8px 16px max(8px, env(safe-area-inset-bottom));
    border-top: 1px solid var(--bord); align-items: center;
  }
  button {
    font: inherit; padding: 8px 10px; border: 1px solid var(--bord); border-radius: 8px;
    background: var(--bouton); color: inherit; cursor: pointer;
  }
  button:active { background: var(--appui); }
  #lien { margin-left: auto; }
  #etat { flex: none; width: 10px; height: 10px; border-radius: 50%; background: #ccc; }
  #etat.ok { background: #3a3; }
  #etat.err { background: #d33; }

  #voile {
    position: fixed; inset: 0; background: var(--voile);
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  #voile[hidden] { display: none; }
  #popup {
    background: var(--fond); border-radius: 12px; padding: 20px; width: 100%; max-width: 360px;
    box-shadow: 0 10px 30px rgba(0,0,0,.25);
  }
  #popup p { margin: 0 0 16px; }
  #popup input {
    width: 100%; margin: 0 0 16px; padding: 8px; font: 14px ui-monospace, monospace;
    border: 1px solid var(--bord); border-radius: 8px; background: var(--appui); color: inherit;
  }
  #popup input[hidden] { display: none; }
  #boutons { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
  #popup .danger { background: #d33; border-color: #d33; color: #fff; }
  #popup .principal { background: var(--texte); border-color: var(--texte); color: var(--fond); }

  #toast {
    position: fixed; left: 50%; bottom: 72px; transform: translateX(-50%);
    background: var(--texte); color: var(--fond); padding: 8px 16px; border-radius: 8px;
    opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  #toast.visible { opacity: 1; }
</style>
</head>
<body>
<div id="onglets" role="tablist">
  <button role="tab">1</button>
  <button role="tab">2</button>
  <button role="tab">3</button>
</div>
<textarea id="note" spellcheck="false" autofocus></textarea>
<nav>
  <button id="effacer">Effacer</button>
  <button id="copier">Copier</button>
  <button id="synchro">Synchro</button>
  <button id="lien" title="Lien secret de ce bloc-notes" aria-label="Lien secret">🔗</button>
  <span id="etat" title="Synchronisation"></span>
</nav>
<div id="voile" hidden>
  <div id="popup" role="dialog" aria-modal="true">
    <p id="message"></p>
    <input id="champ" hidden autocomplete="off" spellcheck="false">
    <div id="boutons"></div>
  </div>
</div>
<div id="toast" role="status"></div>
<script src="config.js"></script>
<script>
(async () => {
  const note = document.getElementById('note');
  const etat = document.getElementById('etat');
  const boutonsOnglets = [...document.querySelectorAll('#onglets button')];
  const base = DATABASE_URL.replace(/\/$/, '');
  const FORMAT_CLE = /^[A-Za-z0-9_-]{22,}$/;

  // Stockage local protégé (navigation privée, quota plein…)
  const stock = {
    lire(k) { try { return localStorage.getItem(k); } catch { return null; } },
    ecrire(k, v) { try { localStorage.setItem(k, v); } catch {} },
    effacer(k) { try { localStorage.removeItem(k); } catch {} },
  };

  // Popup maison (remplace confirm/prompt du navigateur)
  const voile = document.getElementById('voile');
  const champ = document.getElementById('champ');
  function popup({ message, valeurChamp, longueurMax, boutons, fermable = true }) {
    document.getElementById('message').textContent = message;
    champ.hidden = valeurChamp === undefined;
    champ.value = valeurChamp || '';
    if (longueurMax) champ.maxLength = longueurMax; else champ.removeAttribute('maxlength');
    const zone = document.getElementById('boutons');
    zone.replaceChildren();
    voile.hidden = false;
    return new Promise(resoudre => {
      const fermer = valeur => {
        voile.hidden = true;
        voile.onclick = document.onkeydown = champ.onkeydown = null;
        resoudre({ valeur, champ: champ.value.trim() });
      };
      boutons.forEach(({ texte, classe, valeur }) => {
        const b = document.createElement('button');
        b.textContent = texte;
        if (classe) b.className = classe;
        b.onclick = () => fermer(valeur);
        zone.append(b);
      });
      champ.onkeydown = e => { if (e.key === 'Enter') fermer(boutons[boutons.length - 1].valeur); };
      if (fermable) {
        voile.onclick = e => { if (e.target === voile) fermer(null); };
        document.onkeydown = e => { if (e.key === 'Escape') fermer(null); };
      }
      (champ.hidden ? zone.lastChild : champ).focus();
    });
  }

  const toast = document.getElementById('toast');
  function annoncer(message) {
    toast.textContent = message;
    toast.classList.add('visible');
    clearTimeout(toast.minuteur);
    toast.minuteur = setTimeout(() => toast.classList.remove('visible'), 1500);
  }

  // Clé secrète : dans l'adresse (#…), sinon mémorisée sur l'appareil
  const extraireCle = texte => (texte.includes('#') ? texte.split('#').pop() : texte).trim();
  const nouvelleCle = () => btoa(String.fromCharCode(...crypto.getRandomValues(new Uint8Array(18))))
    .replace(/\+/g, '-').replace(/\//g, '_');
  const lienSecret = cle => location.href.split('#')[0] + '#' + cle;

  let cle = extraireCle(location.hash.slice(1));
  if (!FORMAT_CLE.test(cle)) cle = stock.lire('cle') || '';
  while (!FORMAT_CLE.test(cle)) {
    const r = await popup({
      message: 'Collez le lien secret de votre bloc-notes (bouton 🔗 sur un appareil déjà configuré), ou créez-en un nouveau.',
      valeurChamp: '',
      fermable: false,
      boutons: [
        { texte: 'Nouveau', valeur: 'nouveau' },
        { texte: 'Ouvrir', classe: 'principal', valeur: 'ouvrir' },
      ],
    });
    if (r.valeur === 'nouveau') cle = nouvelleCle();
    else { cle = extraireCle(r.champ); if (!FORMAT_CLE.test(cle)) annoncer('Lien invalide'); }
  }
  stock.ecrire('cle', cle);
  history.replaceState(null, '', lienSecret(cle));
  window.addEventListener('hashchange', () => {
    const autre = extraireCle(location.hash.slice(1));
    if (FORMAT_CLE.test(autre) && autre !== cle) location.reload();
  });
  // Restes de la toute première version (sans clé)
  ['note:note', 'note:note2', 'note:note3'].forEach(stock.effacer);

  // ---- Fusion de textes ----
  // Zone modifiée entre deux textes : [debut, fin) dans a, remplacée par b.slice(debut, b.length - (a.length - fin))
  function zoneModifiee(a, b) {
    let debut = 0;
    while (debut < a.length && debut < b.length && a[debut] === b[debut]) debut++;
    let fin = 0;
    while (fin < a.length - debut && fin < b.length - debut && a[a.length - 1 - fin] === b[b.length - 1 - fin]) fin++;
    return { debut, fin: a.length - fin, remplacement: b.slice(debut, b.length - fin) };
  }

  // Fusion à trois : modifications locales et distantes faites depuis la même version de départ.
  // Si elles touchent des endroits différents, les deux sont gardées ; sinon le texte local l'emporte.
  function fusionner(depart, local, distant) {
    if (local === depart || local === distant) return distant;
    if (distant === depart) return local;
    const l = zoneModifiee(depart, local), d = zoneModifiee(depart, distant);
    if (l.fin <= d.debut)
      return depart.slice(0, l.debut) + l.remplacement + depart.slice(l.fin, d.debut) + d.remplacement + depart.slice(d.fin);
    if (d.fin <= l.debut)
      return depart.slice(0, d.debut) + d.remplacement + depart.slice(d.fin, l.debut) + l.remplacement + depart.slice(l.fin);
    return local;
  }

  const cout = (a, b) => { const z = zoneModifiee(a, b); return z.fin - z.debut + z.remplacement.length; };

  // ---- Notes ----
  // texte : contenu local ; depart : dernière version du serveur connue (le texte local en dérive) ;
  // les deux sont mémorisés, donc une modification non envoyée survit à la fermeture de l'appli.
  const onglets = ['1', '2', '3'].map(nom => {
    const cache = `note:${cle}:${nom}`;
    const texte = stock.lire(cache) || '';
    return {
      url: `${base}/notes/${cle}/${nom}.json`,
      urlNom: `${base}/notes/${cle}/n${nom}.json`,
      numero: nom,
      nom: stock.lire(`${cache}:nom`) || '',
      nomAEnvoyer: stock.lire(`${cache}:nom-a-envoyer`) === '1',
      cache,
      texte,
      depart: stock.lire(cache + ':depart') ?? texte,
      peutEtre: stock.lire(cache + ':envoye'), // envoyé à la fermeture, sans savoir si c'est arrivé
      etag: null,        // version du serveur correspondant à « depart », pour les envois conditionnels
      enCours: null,     // texte en cours d'envoi
      aRelire: false,    // un changement distant est arrivé pendant un envoi
      echec: false,      // le dernier envoi a échoué
      occupe: false,     // envoi en cours de préparation ou en vol
      envois: 0,         // nombre d'envois terminés (détecte les lectures périmées)
      attenteDepuis: 0,  // début des modifications non envoyées
      minuteur: null,
    };
  });
  const aEnvoyer = o => o.texte !== o.depart;

  // Point d'état : rouge si la dernière lecture a échoué ou si un envoi est en échec
  let lectureEnEchec = false;
  function majEtat() {
    etat.className = lectureEnEchec || onglets.some(o => o.echec) ? 'err' : 'ok';
  }

  let actif = onglets[+stock.lire('onglet')] || onglets[0];

  function definir(o, { texte = o.texte, depart = o.depart }) {
    const ancien = o.texte;
    o.texte = texte;
    o.depart = depart;
    stock.ecrire(o.cache, texte);
    stock.ecrire(o.cache + ':depart', depart);
    if (o === actif && note.value !== texte) afficher(ancien, texte);
  }

  // Remplace le texte affiché en gardant le curseur au bon endroit
  function afficher(ancien, nouveau) {
    if (note.value !== ancien || document.activeElement !== note) { note.value = nouveau; return; }
    const z = zoneModifiee(ancien, nouveau);
    const decalage = nouveau.length - ancien.length;
    const placer = pos => pos <= z.debut ? pos : pos >= z.fin ? pos + decalage : z.debut + z.remplacement.length;
    const debut = placer(note.selectionStart), fin = placer(note.selectionEnd);
    note.value = nouveau;
    note.setSelectionRange(debut, fin);
  }

  // Version du serveur reçue (flux, interrogation, réponse à un envoi refusé)
  function recevoir(o, distant, etag) {
    distant = typeof distant === 'string' ? distant : '';
    if (o.enCours !== null) {
      if (distant !== o.enCours) o.aRelire = true; // à revoir une fois l'envoi terminé
      return;
    }
    if (o.peutEtre !== null) {
      // L'envoi de dernière minute est-il arrivé ? La version de départ la plus probable
      // est celle qui explique la version du serveur avec la plus petite modification.
      if (cout(o.peutEtre, distant) < cout(o.depart, distant)) o.depart = o.peutEtre;
      oublierPeutEtre(o);
    }
    if (distant === o.depart) { if (etag) o.etag = etag; return; }
    o.etag = etag || null;
    definir(o, { texte: fusionner(o.depart, o.texte, distant), depart: distant });
    if (aEnvoyer(o)) planifier(o);
  }

  const entetesLecture = { 'X-Firebase-ETag': 'true' };
  // Sans étiquette de version (proxy qui la supprimerait), envoi non conditionnel
  const entetesEnvoi = o => o.etag ? { ...entetesLecture, 'if-match': o.etag } : entetesLecture;

  // Lecture directe ; le paramètre t évite les réponses mises en cache par un proxy
  async function lire(o) {
    const envois = o.envois;
    let r, data;
    try {
      r = await fetch(`${o.url}?t=${Date.now()}`, { cache: 'no-store', headers: entetesLecture });
      if (!r.ok) throw new Error(r.status);
      data = await r.json();
      lectureEnEchec = false;
    } catch (e) {
      lectureEnEchec = true;
      throw e;
    } finally {
      majEtat();
    }
    // Réponse périmée si un envoi a eu lieu entre-temps
    if (o.envois === envois && o.enCours === null) recevoir(o, data, r.headers.get('ETag'));
  }

  // Envoi conditionnel : refusé (412) si le serveur a changé depuis « depart »
  async function envoyer(o) {
    clearTimeout(o.minuteur);
    o.minuteur = null;
    if (o.occupe || !aEnvoyer(o)) return;
    o.occupe = true; // un seul envoi à la fois par note
    try {
      if (!o.etag) await lire(o);
      if (aEnvoyer(o)) {
        const texte = o.texte;
        o.enCours = texte;
        o.attenteDepuis = 0;
        let r;
        try {
          r = await fetch(o.url, { method: 'PUT', headers: entetesEnvoi(o), body: JSON.stringify(texte) });
        } finally {
          o.enCours = null;
          o.envois++;
        }
        if (r.status === 412) {
          // Quelqu'un a écrit entre-temps : fusionner avec sa version, puis renvoyer
          o.etag = null;
          recevoir(o, await r.json(), r.headers.get('ETag'));
        } else if (r.ok) {
          o.etag = r.headers.get('ETag');
          definir(o, { depart: texte });
          oublierPeutEtre(o);
        } else {
          throw new Error(r.status);
        }
      }
      o.echec = false;
    } catch {
      o.echec = true;
    } finally {
      o.occupe = false;
    }
    majEtat();
    if (o.echec) { o.minuteur = setTimeout(() => envoyer(o), 3000); return; }
    if (o.aRelire) { o.aRelire = false; lire(o).catch(() => {}); }
    if (aEnvoyer(o)) planifier(o, 0);
  }

  // Envoi 0,4 s après la dernière frappe, et au moins toutes les 1,5 s pendant une frappe continue
  function planifier(o, delai = 400) {
    const maintenant = Date.now();
    o.attenteDepuis ||= maintenant;
    clearTimeout(o.minuteur);
    o.minuteur = setTimeout(() => envoyer(o), Math.min(delai, Math.max(0, o.attenteDepuis + 1500 - maintenant)));
  }

  function oublierPeutEtre(o) {
    o.peutEtre = null;
    stock.effacer(o.cache + ':envoye');
  }

  // Envoi de dernière minute quand l'appli passe en arrière-plan ou se ferme.
  // Si la page survit, la réponse est traitée ; sinon le texte envoyé est mémorisé
  // pour savoir, à la réouverture, s'il est arrivé.
  function envoyerAvantFermeture() {
    onglets.forEach(o => {
      if (!aEnvoyer(o) || o.occupe || !o.etag) return; // seulement en envoi conditionnel
      const texte = o.texte;
      o.peutEtre = texte;
      stock.ecrire(o.cache + ':envoye', texte);
      o.occupe = true;
      fetch(o.url, { method: 'PUT', keepalive: true, headers: entetesEnvoi(o), body: JSON.stringify(texte) })
        .then(r => {
          if (r.ok) { o.etag = r.headers.get('ETag'); o.envois++; definir(o, { depart: texte }); }
          if (r.status === 412 || r.ok) oublierPeutEtre(o);
        })
        .catch(() => {})
        .finally(() => { o.occupe = false; if (aEnvoyer(o) && !document.hidden) planifier(o, 0); });
    });
  }

  // ---- Réception ----
  // Flux en direct (Server-Sent Events) pour l'onglet affiché, plus une interrogation toutes les 2 s :
  // certains proxys d'entreprise retiennent le flux ou ne le livrent que par paquets.
  // Si le flux n'arrive jamais, on n'utilise plus que l'interrogation.
  let flux, dernierSignal = 0;
  let fluxBloque = false, minuteurSondage, minuteurSecours, tourSondage = 0;

  async function sonder(o) {
    clearTimeout(minuteurSondage);
    const tour = tourSondage;
    if (!document.hidden) {
      try { await lire(o); } catch {}
    }
    if (o === actif && tour === tourSondage) minuteurSondage = setTimeout(() => sonder(o), 2000);
  }

  function ecouter(o) {
    if (flux) flux.close();
    clearTimeout(minuteurSondage);
    clearTimeout(minuteurSecours);
    tourSondage++;
    sonder(o);
    if (fluxBloque) return;
    flux = new EventSource(o.url);
    dernierSignal = Date.now();
    // Firebase envoie la valeur dès l'ouverture : rien après 5 s = flux bloqué
    minuteurSecours = setTimeout(() => { fluxBloque = true; flux.close(); }, 5000);
    flux.addEventListener('put', e => {
      clearTimeout(minuteurSecours);
      dernierSignal = Date.now();
      const { path, data } = JSON.parse(e.data);
      if (path === '/') recevoir(o, data, null);
    });
    flux.addEventListener('keep-alive', () => { dernierSignal = Date.now(); });
    flux.addEventListener('cancel', () => { lectureEnEchec = true; majEtat(); }); // accès refusé par les règles
  }

  // Les connexions meurent souvent sans prévenir (téléphone en veille, changement de réseau) :
  // on se reconnecte au retour sur l'appli, au retour du réseau, ou après 75 s de silence du flux
  // (Firebase envoie un signal toutes les 30 s environ)
  function reprendre() {
    ecouter(actif);
    lireNoms();
    onglets.forEach(o => { if (aEnvoyer(o)) envoyer(o); });
  }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) envoyerAvantFermeture(); else reprendre();
  });
  window.addEventListener('pagehide', envoyerAvantFermeture);
  window.addEventListener('online', reprendre);
  window.addEventListener('pageshow', e => { if (e.persisted) reprendre(); });
  setInterval(() => {
    if (!fluxBloque && !document.hidden && (flux.readyState === EventSource.CLOSED || Date.now() - dernierSignal > 75000)) reprendre();
  }, 15000);

  // ---- Noms des onglets (synchronisés, rarement modifiés : lus toutes les 10 s) ----
  const titre = o => o.nom || o.numero;
  function afficherNoms() {
    boutonsOnglets.forEach((b, i) => { b.textContent = titre(onglets[i]); b.title = titre(onglets[i]); });
  }

  function definirNom(o, nom, aEnvoyer) {
    o.nom = nom;
    o.nomAEnvoyer = aEnvoyer;
    stock.ecrire(o.cache + ':nom', nom);
    stock.ecrire(o.cache + ':nom-a-envoyer', aEnvoyer ? '1' : '');
    afficherNoms();
  }

  async function lireNoms() {
    if (document.hidden) return;
    await Promise.all(onglets.map(async o => {
      if (o.nomAEnvoyer) return envoyerNom(o);
      try {
        const r = await fetch(`${o.urlNom}?t=${Date.now()}`, { cache: 'no-store' });
        if (!r.ok) return;
        const nom = await r.json();
        if (!o.nomAEnvoyer) definirNom(o, typeof nom === 'string' ? nom : '', false);
      } catch {}
    }));
  }

  async function envoyerNom(o) {
    const nom = o.nom;
    try {
      const r = await fetch(o.urlNom, { method: 'PUT', body: JSON.stringify(nom) });
      if (r.ok && o.nom === nom) definirNom(o, nom, false);
    } catch {}
  }

  setInterval(lireNoms, 10000);

  async function renommer(o) {
    const r = await popup({
      message: `Nom de l'onglet ${o.numero} (vide = « ${o.numero} »)`,
      valeurChamp: o.nom,
      longueurMax: 20,
      boutons: [{ texte: 'Annuler', valeur: false }, { texte: 'Renommer', classe: 'principal', valeur: true }],
    });
    if (!r.valeur) return;
    const nom = r.champ.slice(0, 20).trim();
    if (nom === o.nom) return;
    definirNom(o, nom, true);
    envoyerNom(o);
  }

  // ---- Interface ----
  function choisir(o) {
    actif = o;
    boutonsOnglets.forEach((b, i) => b.setAttribute('aria-selected', onglets[i] === o));
    note.value = o.texte;
    stock.ecrire('onglet', onglets.indexOf(o));
    ecouter(o);
  }

  // Toucher l'onglet déjà affiché permet de le renommer
  boutonsOnglets.forEach((b, i) => b.onclick = () => {
    if (onglets[i] !== actif) choisir(onglets[i]); else renommer(actif);
  });

  note.addEventListener('input', () => {
    definir(actif, { texte: note.value });
    planifier(actif);
  });

  async function copier(texte) {
    try {
      await navigator.clipboard.writeText(texte);
    } catch {
      const zone = document.createElement('textarea');
      zone.value = texte;
      document.body.append(zone);
      zone.select();
      document.execCommand('copy');
      zone.remove();
    }
  }

  document.getElementById('effacer').onclick = async () => {
    const o = actif;
    if (!o.texte) return;
    const r = await popup({
      message: `Effacer « ${titre(o)} » sur tous les appareils ?`,
      boutons: [{ texte: 'Annuler', valeur: false }, { texte: 'Effacer', classe: 'danger', valeur: true }],
    });
    if (!r.valeur) return;
    definir(o, { texte: '' });
    envoyer(o);
    annoncer('Note effacée');
  };

  document.getElementById('copier').onclick = async () => {
    await copier(note.value);
    annoncer(note.value ? 'Copié ✓' : 'Note vide');
  };

  // Synchro manuelle : envoyer ce qui est en attente, puis récupérer la version du serveur
  document.getElementById('synchro').onclick = async () => {
    const o = actif;
    await envoyer(o);
    if (aEnvoyer(o)) { annoncer('Envoi impossible, réessayez'); return; }
    try {
      await lire(o);
      annoncer('Synchronisé ✓');
    } catch {
      annoncer('Échec de la synchro');
    }
  };

  document.getElementById('lien').onclick = async () => {
    const r = await popup({
      message: 'Lien secret de ce bloc-notes, à ouvrir sur vos autres appareils. Toute personne qui l\'a peut lire et modifier les notes.',
      valeurChamp: lienSecret(cle),
      boutons: [{ texte: 'Fermer', valeur: false }, { texte: 'Copier le lien', classe: 'principal', valeur: true }],
    });
    if (!r.valeur) return;
    await copier(lienSecret(cle));
    annoncer('Lien copié ✓');
  };

  afficherNoms();
  choisir(actif);
  lireNoms();
  onglets.forEach(o => { if (aEnvoyer(o)) envoyer(o); });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
